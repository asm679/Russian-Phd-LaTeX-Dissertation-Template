# Конфигурация модуля BBBsoft

# Настройки логирования
logging:
  level: INFO
  file: ./logs/bbbsoft.log
  max_size: 10485760  # 10MB
  backup_count: 5

# Настройки датчиков
sensors:
  # ДШК
  adc:
    # Канал АЦП. Частота опроса задается параметром frequency_hz.
    channel: 0                      # Номер канала АЦП (0-7)
    frequency_hz: 10                # Частота опроса АЦП
  # Инклинометр
  inclinometer:
    device: /dev/ttyS5              # Порт подключения
    baudrate: 115200                # Скорость соединения
    message_header_hex: "7710ff84"  # Шестнадцатеричный заголовок сообщения

# Настройки коммуникации
communication:
  zmq:
    host: 192.168.1.184  # IP-адрес основного сервера ZMQ
    sim_host: localhost  # IP-адрес сервера ZMQ для режима симуляции
    port: 5555           # Порт ZMQ
    identity: BBBlue     # Идентификатор клиента (BeagleBone Blue)
    socket_type: DEALER  # Тип сокета ZMQ

# Настройки основного цикла
processing: 
  frequency_hz: 1,     # Периодичность усреднения и отправки данных (Гц)
  aggregation_period_sec: 1  # Длительность окна усреднения данных (сек)

